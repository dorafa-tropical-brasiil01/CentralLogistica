<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a2540" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <title>Logística — Do'Rafa</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --brand: #0a2540; --brand-2: #123a5e; --accent: #00d4aa; --accent-2: #00b894;
      --warn: #f4a261; --danger: #e76f51; --info: #3a86ff;
      --bg: #f6f8fb; --surface: #ffffff; --surface-2: #f1f5f9;
      --text: #0f172a; --text-2: #475569; --text-3: #94a3b8;
      --border: #e2e8f0; --shadow: 0 8px 24px rgba(10,37,64,.08); --shadow-lg: 0 20px 48px rgba(10,37,64,.12);
      --radius: 18px; --radius-sm: 12px;
    }
    /* Dark mode desativado — causa texto branco em fundo branco em alguns elementos */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.35; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
    .app { display: flex; flex-direction: column; height: 100%; }
    .hidden { display: none !important; }

    .login { display: grid; place-items: center; min-height: 100vh; padding: 20px; background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%); }
    .login-card { width: min(420px, 100%); background: var(--surface); border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow-lg); text-align: center; }
    .login-card h1 { color: var(--brand); font-weight: 900; font-size: 24px; margin-bottom: 6px; }
    .login-card p { color: var(--text-2); font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; font-family: inherit; background: var(--surface-2); color: var(--text); }
    .form-group input:focus { outline: none; border-color: var(--accent); }
    .btn { width: 100%; border: 0; border-radius: var(--radius-sm); padding: 14px; font-size: 15px; font-weight: 900; cursor: pointer; transition: filter .15s; }
    .btn-primary { background: var(--accent); color: #002c22; }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-accent { background: var(--accent); color: #002c22; }
    .btn-warn { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
    .btn-danger { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .btn-info { background: #eff6ff; color: var(--info); border: 1px solid #bfdbfe; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .topbar { position: sticky; top: 0; z-index: 1000; background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%); color: #fff; padding: 12px 18px; box-shadow: 0 4px 20px rgba(10,37,64,.25); }
    .topbar-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; flex-shrink: 0; overflow: hidden; }
    .brand-icon img { width: 100%; height: 100%; object-fit: cover; }
    .brand-title { font-weight: 900; font-size: 18px; white-space: nowrap; }
    .brand-sub { font-size: 12px; opacity: .8; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-ghost { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: 8px 10px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }

    @media (max-width: 600px) {
      .topbar { padding: 10px 12px; }
      .topbar-inner { flex-wrap: wrap; gap: 8px; }
      .brand { flex: 1 1 auto; min-width: 0; }
      .brand-title { font-size: 16px; }
      .brand-sub { font-size: 11px; }
      .topbar-actions { flex: 1 1 100%; justify-content: flex-end; gap: 6px; }
      .btn-ghost { padding: 8px 10px; font-size: 11px; }
      #pushBtn { flex: 1; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
      .btn { padding: 12px; font-size: 14px; }
      .run-card { padding: 14px; margin: 10px; }
    }

    .main { flex: 1; display: grid; grid-template-columns: 380px 1fr; gap: 0; overflow: hidden; max-width: 1400px; margin: 0 auto; width: 100%; }
    @media (max-width: 900px) { .main { grid-template-columns: 1fr; overflow-y: auto; } }

    .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tab { flex: 1; padding: 14px; font-weight: 800; font-size: 13px; text-align: center; cursor: pointer; color: var(--text-3); border-bottom: 3px solid transparent; }
    .tab.active { color: var(--brand); border-bottom-color: var(--accent); background: var(--surface-2); }
    .panel { flex: 1; overflow-y: auto; padding: 14px; display: none; }
    .panel.active { display: block; }

    .section-title { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .6px; color: var(--text-3); margin: 8px 0 10px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
    .card-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .card-title { font-weight: 900; font-size: 15px; }
    .card-sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }
    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 999px; }
    .badge-ready { background: #e6fbf6; color: var(--accent-2); border: 1px solid #b6f3e6; }
    .badge-assigned { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .badge-delivered { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .badge-offline { background: #f1f5f9; color: var(--text-3); border: 1px solid var(--border); }
    .badge-pending { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }

    .order-list { display: flex; flex-direction: column; gap: 10px; }
    .order-mini { padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); cursor: pointer; transition: transform .1s; }
    .order-mini:hover { transform: translateX(4px); border-color: var(--accent); }
    .order-mini .id { font-weight: 900; font-size: 14px; color: var(--brand); }
    .order-mini .addr { font-size: 12px; color: var(--text-2); margin-top: 4px; }
    .order-mini .meta { font-size: 11px; color: var(--text-3); margin-top: 6px; display: flex; gap: 10px; }

    .driver-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .driver-item:last-child { border-bottom: 0; }
    .driver-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--brand-2); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 15px; }
    .driver-info { flex: 1; }
    .driver-name { font-weight: 800; font-size: 14px; }
    .driver-status { font-size: 12px; color: var(--text-2); }
    .driver-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,170,.2); }
    .driver-dot.busy { background: var(--warn); }
    .driver-dot.offline { background: var(--text-3); }

    .run-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin: 14px; box-shadow: var(--shadow); }
    .run-header { display: flex; align-items: center; justify-content: space-between; }
    .run-title { font-weight: 900; font-size: 18px; }
    .run-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }

    .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(120px); z-index: 3000; background: var(--text); color: #fff; padding: 12px 22px; border-radius: 999px; font-weight: 700; font-size: 14px; box-shadow: var(--shadow-lg); opacity: 0; transition: all .3s ease; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .empty { text-align: center; padding: 40px 20px; color: var(--text-3); font-weight: 600; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 18px; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--surface); border-radius: var(--radius); width: min(400px, 100%); padding: 24px; box-shadow: var(--shadow-lg); }
    .modal h3 { font-weight: 900; margin-bottom: 14px; }
    .modal select, .modal button { width: 100%; margin-top: 10px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); font-family: inherit; font-size: 14px; }
    .modal button { background: var(--accent); color: #002c22; border: 0; font-weight: 900; cursor: pointer; }

    /* MAPA LEAFLET */
    .map-wrap { position: relative; overflow: hidden; display: flex; flex-direction: column; min-height: 400px; }
    #map { width: 100%; height: 100%; flex: 1; z-index: 1; }
    .map-overlay { position: absolute; top: 14px; left: 14px; z-index: 500; background: rgba(11,22,35,.85); color: #fff; border-radius: var(--radius-sm); padding: 12px; backdrop-filter: blur(8px); font-size: 13px; pointer-events: none; }
    .map-legend { position: absolute; bottom: 14px; right: 14px; z-index: 500; background: rgba(11,22,35,.85); color: #fff; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 12px; backdrop-filter: blur(8px); pointer-events: none; }
    .map-legend span { display: inline-flex; align-items: center; gap: 6px; margin-left: 12px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .dot.driver { background: var(--accent); }
    .dot.ready { background: var(--warn); }
    .dot.done { background: var(--info); }
    .dot.zone { background: rgba(0,212,170,.3); border: 1px solid var(--accent); }

    .refresh-btn { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--text-2); }

    /* Marcador customizado do entregador */
    .driver-marker { background: var(--accent); border: 3px solid #fff; border-radius: 50%; width: 32px; height: 32px; display: grid; place-items: center; font-weight: 900; font-size: 12px; color: var(--brand); box-shadow: 0 4px 12px rgba(0,0,0,.3); }
    .order-marker { background: var(--warn); border: 3px solid #fff; border-radius: 50%; width: 28px; height: 28px; display: grid; place-items: center; font-weight: 900; font-size: 10px; color: var(--brand); box-shadow: 0 4px 12px rgba(0,0,0,.3); }
    .order-marker.assigned { background: var(--info); }
    .order-marker.done { background: #64748b; }
  </style>
</head>
<body>
  <div id="login" class="login">
    <div class="login-card">
      <img src="/static/logo-remo.png" alt="REMO" style="width:80px;height:80px;border-radius:16px;margin:0 auto 12px;display:block" />
      <h1>REMO</h1>
      <p>Central Logística — Acesse com suas credenciais</p>
      <form onsubmit="doLogin(event)">
        <div class="form-group">
          <label>Usuário</label>
          <input id="loginUser" type="text" placeholder="seu.usuario" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input id="loginPass" type="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button class="btn btn-primary" type="submit">Entrar</button>
      </form>
      <p style="font-size:11px;color:var(--text-3);margin-top:14px">REMO — Central Logística</p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-icon"><img src="/static/logo-remo.png" alt="REMO"></div>
          <div>
            <div class="brand-title">REMO</div>
            <div class="brand-sub" id="roleLabel">—</div>
            <div class="brand-sub" id="gpsStatus" style="color:#dc3545;font-weight:700">📍 GPS: OFF</div>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="btn-ghost" id="pushBtn" onclick="togglePush()">🔔 Carregando...</button>
          <button class="btn-ghost refresh-btn" onclick="carregarDados()">↻ Atualizar</button>
          <button class="btn-ghost" onclick="limparCache()">🗑️ Cache</button>
          <button class="btn-ghost" onclick="doLogout()">Sair</button>
        </div>
      </div>
    </header>

    <div id="entregadorView" class="main" style="grid-template-columns:1fr; overflow-y:auto; display:none;">
      <div class="sidebar" style="border-right:0;">
        <div class="tabs">
          <div class="tab active" onclick="switchTabEnt(this, 'disp')">Disponíveis</div>
          <div class="tab" onclick="switchTabEnt(this, 'minhas')">Minhas corridas</div>
          <div class="tab" onclick="switchTabEnt(this, 'salario')">Meu salário</div>
        </div>
        <div class="panel active" id="panel-disp">
          <div class="section-title">Entregas disponíveis — toque para pegar</div>
          <div class="order-list" id="dispList"></div>
        </div>
        <div class="panel" id="panel-minhas">
          <div id="entregadorRun"></div>
        </div>
        <div class="panel" id="panel-salario">
          <div id="salarioContent"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="assignModal">
    <div class="modal">
      <h3>Atribuir ordem</h3>
      <p id="assignText" style="font-size:13px;color:var(--text-2);margin-bottom:10px">Selecione o entregador.</p>
      <select id="assignSelect"></select>
      <button onclick="confirmAssign()">Atribuir</button>
      <button style="background:var(--surface-2);color:var(--text);margin-top:8px" onclick="closeAssign()">Cancelar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API = '/api/pwa';
    let token = sessionStorage.getItem('remo_token') || '';
    let currentUser = null;
    let assignOrdemId = null;
    let pendentes = [];
    let entregadores = [];
    let ativas = [];
    let pollTimer = null;
    let map = null;
    let markersLayer = null;
    let zonesLayer = null;
    let routesLayer = null;
    let gpsWatchId = null;

    // --- Zonas de preço (polígonos verdes) ---
    // Coordenadas de exemplo — Goiânia. Em produção, vem da API.
    const ZONAS_PRECO = [
      {
        nome: 'Centro', preco: 5.00, cor: '#00d4aa',
        coords: [[-16.6800, -49.2700], [-16.6800, -49.2500], [-16.7200, -49.2500], [-16.7200, -49.2700]],
      },
      {
        nome: 'Setor Bueno', preco: 8.00, cor: '#00b894',
        coords: [[-16.7800, -49.2600], [-16.7800, -49.2300], [-16.8200, -49.2300], [-16.8200, -49.2600]],
      },
      {
        nome: 'Jardim Goiás', preco: 10.00, cor: '#00a896',
        coords: [[-16.7400, -49.2200], [-16.7400, -49.1900], [-16.7800, -49.1900], [-16.7800, -49.2200]],
      },
      {
        nome: 'Marista', preco: 12.00, cor: '#0d9488',
        coords: [[-16.7000, -49.2900], [-16.7000, -49.2700], [-16.7400, -49.2700], [-16.7400, -49.2900]],
      },
    ];

    // --- Coordenadas padrão (Goiânia) ---
    const DEFAULT_CENTER = [-16.6869, -49.2648];
    const DEFAULT_ZOOM = 13;

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show';
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    function money(v) { return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ','); }

    async function api(path, opts = {}) {
      const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
      if (token) headers['Authorization'] = 'Bearer ' + token;
      const r = await fetch(API + path, { ...opts, headers });
      if (r.status === 401) { doLogout(); throw new Error('nao_autenticado'); }
      return r;
    }

    // --- Login ---
    async function doLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUser').value.trim();
      const senha = document.getElementById('loginPass').value.trim();
      if (!username || !senha) return;
      try {
        const r = await fetch(API + '/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, senha }),
        });
        if (!r.ok) {
          const j = await r.json().catch(() => ({}));
          showToast('Erro: ' + (j.error || r.status));
          return;
        }
        const j = await r.json();
        if (j.usuario.perfil !== 'ENTREGADOR') {
          showToast('Acesso restrito a entregadores. Use /admin ou /portal.');
          return;
        }
        token = j.token;
        sessionStorage.setItem('remo_token', token);
        currentUser = j.usuario;
        showApp();
      } catch (err) {
        showToast('Erro de conexão');
      }
    }

    function doLogout() {
      if (token) api('/logout', { method: 'POST' }).catch(() => {});
      token = '';
      sessionStorage.removeItem('remo_token');
      currentUser = null;
      if (gpsWatchId !== null) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      document.getElementById('login').classList.remove('hidden');
      document.getElementById('app').classList.add('hidden');
    }

    async function limparCache() {
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        showToast('Cache limpo! Recarregando...');
        setTimeout(() => location.reload(true), 1000);
      } catch (err) {
        showToast('Erro ao limpar cache');
      }
    }

    async function showApp() {
      document.getElementById('login').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('roleLabel').textContent = 'Entregador: ' + (currentUser.nome || currentUser.username);
      document.getElementById('entregadorView').style.display = 'flex';
      renderDisponiveis();
      renderEntregadorView();
      renderSalario();
      pollTimer = setInterval(() => { renderDisponiveis(); renderEntregadorView(); renderSalario(); }, 10000);
      iniciarGPS();
      initPushUI();
    }

    function switchTabEnt(el, name) {
      document.querySelectorAll('#entregadorView .tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('#entregadorView .panel').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('panel-' + name).classList.add('active');
    }

    // --- Entregador: ordens disponíveis ---
    let disponiveis = [];

    async function renderDisponiveis() {
      const dispEl = document.getElementById('dispList');
      if (!dispEl) return;
      try {
        const r = await api('/disponiveis');
        const j = await r.json();
        disponiveis = j.disponiveis || [];
        if (!disponiveis.length) {
          const motivo = j.motivo === 'ja_tem_corrida_ativa' ? 'Você já tem uma corrida ativa' : 'Nenhuma entrega disponível';
          dispEl.innerHTML = '<div class="empty">' + motivo + '</div>';
          return;
        }
        dispEl.innerHTML = disponiveis.map(o => {
          const p = o.payload || {};
          const cliente = p.cliente_nome || '—';
          const taxa = money(o.taxa);
          const proto = o.protocolo || o.solicitacao_id;
          return `
            <div class="order-mini" style="cursor:pointer;border-color:var(--accent);border-width:2px" onclick="reivindicar(${o.id})">
              <div class="card-row">
                <div class="id">${proto}</div>
                <span class="badge badge-ready">Pegar entrega</span>
              </div>
              <div class="addr">${cliente}</div>
              <div class="meta"><span>${o.solicitacao_id}</span><span>${taxa}</span></div>
            </div>
          `;
        }).join('');
      } catch (err) {
        if (err.message !== 'nao_autenticado') dispEl.innerHTML = '<div class="empty">Erro ao carregar</div>';
      }
    }

    async function reivindicar(ordemId) {
      try {
        const r = await api('/ordens/' + ordemId + '/reivindicar', { method: 'POST' });
        if (r.ok) {
          showToast('Entrega pegada com sucesso!');
          renderDisponiveis();
          renderEntregadorView();
          // Troca para aba "Minhas corridas"
          const tabMinhas = document.querySelectorAll('#entregadorView .tab')[1];
          if (tabMinhas) switchTabEnt(tabMinhas, 'minhas');
        } else if (r.status === 409) {
          const j = await r.json().catch(() => ({}));
          showToast('Entrega já foi pega por outro entregador');
          renderDisponiveis();
        } else if (r.status === 403) {
          const j = await r.json().catch(() => ({}));
          if (j.error === 'gps_obrigatorio') {
            showToast('📍 GPS obrigatório! Ative o GPS e tente novamente.');
          } else if (j.error === 'ja_tem_corrida_ativa') {
            showToast('Você já tem uma corrida ativa');
          } else {

    // --- Mapa Leaflet ---
    function initMap() {
      if (map) { map.remove(); map = null; }
      map = L.map('map', { zoomControl: true, attributionControl: false }).setView(DEFAULT_CENTER, DEFAULT_ZOOM);

      // Tile layer (dark mode friendly)
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const tileUrl = isDark
        ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
        : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
      L.tileLayer(tileUrl, { maxZoom: 19, subdomains: 'abcd' }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
      zonesLayer = L.layerGroup().addTo(map);
      routesLayer = L.layerGroup().addTo(map);

      renderZonas();
    }

    function renderZonas() {
      if (!zonesLayer) return;
      zonesLayer.clearLayers();

      ZONAS_PRECO.forEach(zona => {
        const polygon = L.polygon(zona.coords, {
          color: zona.cor,
          weight: 2,
          opacity: 0.8,
          fillColor: zona.cor,
          fillOpacity: 0.15,
        });
        polygon.bindTooltip(zona.nome + ' — ' + money(zona.preco), { permanent: false, direction: 'center' });
        polygon.addTo(zonesLayer);
      });
    }

    function extractLatLngFromUrl(url) {
      if (!url) return null;
      // @lat,lng
      let m = url.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
      if (m) return [parseFloat(m[1]), parseFloat(m[2])];
      // q=lat,lng ou query=lat,lng
      m = url.match(/[?&](?:q|query)=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
      if (m) return [parseFloat(m[1]), parseFloat(m[2])];
      // !3dlat!4dlng
      m = url.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
      if (m) return [parseFloat(m[1]), parseFloat(m[2])];
      // ll=lat,lng
      m = url.match(/[?&#]ll=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
      if (m) return [parseFloat(m[1]), parseFloat(m[2])];
      return null;
    }

    function renderMapMarkers() {
      if (!map || !markersLayer) return;
      markersLayer.clearLayers();
      routesLayer.clearLayers();

      // Ordens pendentes (laranja)
      pendentes.forEach(o => {
        const p = o.payload || {};
        const coords = extractLatLngFromUrl(p.client_maps_url);
        if (!coords) return;
        const icon = L.divIcon({
          className: '',
          html: '<div class="order-marker">P</div>',
          iconSize: [28, 28],
          iconAnchor: [14, 14],
        });
        const m = L.marker(coords, { icon }).addTo(markersLayer);
        const proto = o.protocolo || o.solicitacao_id;
        m.bindPopup('<b>' + proto + '</b><br>' + (p.cliente_nome || '—') + '<br>' + money(o.taxa) + '<br><i>Pendente</i>');
      });

      // Ordens ativas (azul/verde) + rota
      ativas.forEach(o => {
        const p = o.payload || {};
        const coords = extractLatLngFromUrl(p.client_maps_url);
        if (!coords) return;
        const isRota = o.status === 'EM_ROTA';
        const icon = L.divIcon({
          className: '',
          html: '<div class="order-marker ' + (isRota ? 'assigned' : 'assigned') + '">R</div>',
          iconSize: [28, 28],
          iconAnchor: [14, 14],
        });
        const m = L.marker(coords, { icon }).addTo(markersLayer);
        const proto = o.protocolo || o.solicitacao_id;
        m.bindPopup('<b>' + proto + '</b><br>' + (p.cliente_nome || '—') + '<br>' + money(o.taxa) + '<br><i>' + o.status + '</i>');

        // Se o entregador tem localização, desenha rota
        const entregador = entregadores.find(d => d.id === o.entregador_id);
        if (entregador && entregador.localizacao) {
          const loc = entregador.localizacao;
          if (loc.lat && loc.lng) {
            // Marcador do entregador
            const dIcon = L.divIcon({
              className: '',
              html: '<div class="driver-marker">' + (entregador.nome || 'E').charAt(0) + '</div>',
              iconSize: [32, 32],
              iconAnchor: [16, 16],
            });
            L.marker([loc.lat, loc.lng], { icon: dIcon }).addTo(markersLayer)
              .bindPopup('<b>' + (entregador.nome || 'Entregador') + '</b><br>Em rota');

            // Linha de rota
            L.polyline([[loc.lat, loc.lng], coords], {
              color: '#00d4aa',
              weight: 3,
              opacity: 0.6,
              dashArray: '8, 8',
            }).addTo(routesLayer);
          }
        }
      });
    }

    // --- GPS do entregador ---
    function iniciarGPS() {
      if (!navigator.geolocation) { showToast('GPS não disponível neste dispositivo'); return; }
      if (gpsWatchId !== null) { showToast('GPS já está ativo'); return; }
      showToast('Ativando GPS...');
      gpsWatchId = navigator.geolocation.watchPosition(async pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const precisao = pos.coords.accuracy;
        const gpsEl = document.getElementById('gpsStatus');
        if (gpsEl) { gpsEl.textContent = '📍 GPS: ON'; gpsEl.style.color = '#28a745'; }
        try {
          await api('/localizacao', {
            method: 'POST',
            body: JSON.stringify({ lat, lng, precisao }),
          });
        } catch (err) { /* silencioso */ }
      }, err => {
        showToast('Erro GPS: ' + (err.message || 'permissão negada'));
        gpsWatchId = null;
        const gpsEl = document.getElementById('gpsStatus');
        if (gpsEl) { gpsEl.textContent = '📍 GPS: OFF'; gpsEl.style.color = '#dc3545'; }
      }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
    }

    function pararGPS() {
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        showToast('GPS desativado');
        const gpsEl = document.getElementById('gpsStatus');
        if (gpsEl) { gpsEl.textContent = '📍 GPS: OFF'; gpsEl.style.color = '#dc3545'; }
      }
    }

    // --- Web Push ---
    let pushSubscription = null;

    async function initPushUI() {
      const btn = document.getElementById('pushBtn');
      if (!btn) return;
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        btn.textContent = '🔔 Push não suportado';
        btn.disabled = true;
        return;
      }
      // Timeout de 5s — se não resolver, mostra botão manual
      let resolved = false;
      const timeout = setTimeout(() => {
        if (!resolved) {
          btn.textContent = '🔔 Ativar notificações';
        }
      }, 5000);
      try {
        const r = await api('/push/vapid-public-key');
        if (!r.ok) { clearTimeout(timeout); resolved = true; btn.textContent = '🔔 Push indisponível'; return; }
        const j = await r.json();
        if (!j.public_key) { clearTimeout(timeout); resolved = true; btn.textContent = '🔔 Push indisponível'; return; }
        // Aguarda service worker ficar pronto (com timeout)
        let reg;
        try {
          reg = await Promise.race([
            navigator.serviceWorker.ready,
            new Promise((_, reject) => setTimeout(() => reject(new Error('sw_timeout')), 3000))
          ]);
        } catch (swErr) {
          clearTimeout(timeout); resolved = true;
          btn.textContent = '🔔 Ativar notificações';
          return;
        }
        const existing = await reg.pushManager.getSubscription();
        clearTimeout(timeout); resolved = true;
        if (existing) {
          pushSubscription = existing;
          btn.textContent = '🔔 Notificações ativas';
          btn.classList.add('active');
          try {
            await api('/push/inscrever', { method: 'POST', body: JSON.stringify({ subscription: existing }) });
          } catch {}
        } else {
          if (Notification.permission === 'granted') {
            try {
              const sub = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(j.public_key),
              });
              pushSubscription = sub;
              await api('/push/inscrever', { method: 'POST', body: JSON.stringify({ subscription: sub }) });
              btn.textContent = '🔔 Notificações ativas';
              btn.classList.add('active');
            } catch (err) { console.error('[Push] auto-inscricao falhou:', err); btn.textContent = '🔔 Ativar notificações'; }
          } else if (Notification.permission === 'default') {
            try {
              const permission = await Notification.requestPermission();
              if (permission === 'granted') {
                const sub = await reg.pushManager.subscribe({
                  userVisibleOnly: true,
                  applicationServerKey: urlBase64ToUint8Array(j.public_key),
                });
                pushSubscription = sub;
                await api('/push/inscrever', { method: 'POST', body: JSON.stringify({ subscription: sub }) });
                btn.textContent = '🔔 Notificações ativas';
                btn.classList.add('active');
                showToast('Notificações ativadas!');
                setTimeout(() => api('/push/teste', { method: 'POST' }), 500);
              } else {
                btn.textContent = '🔔 Ativar notificações';
              }
            } catch (err) { console.error('[Push] auto-inscricao falhou:', err); btn.textContent = '🔔 Ativar notificações'; }
          } else {
            // Permissão negada
            btn.textContent = '🔔 Push bloqueado';
            btn.disabled = true;
          }
        }
      } catch (err) { clearTimeout(timeout); resolved = true; console.error('[Push] init falhou:', err); btn.textContent = '🔔 Push indisponível'; }
    }

    async function togglePush() {
      const btn = document.getElementById('pushBtn');
      if (pushSubscription) {
        // Desinscrever
        try {
          await pushSubscription.unsubscribe();
          await api('/push/desinscrever', { method: 'POST', body: JSON.stringify({ endpoint: pushSubscription.endpoint }) });
          pushSubscription = null;
          btn.textContent = '🔔 Ativar notificações';
          btn.classList.remove('active');
          showToast('Notificações desativadas');
        } catch { showToast('Erro ao desativar'); }
      } else {
        // Inscrever
        try {
          const permission = await Notification.requestPermission();
          if (permission !== 'granted') { showToast('Permissão negada'); return; }
          const r = await api('/push/vapid-public-key');
          const j = await r.json();
          const reg = await navigator.serviceWorker.ready;
          const sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(j.public_key),
          });
          pushSubscription = sub;
          await api('/push/inscrever', { method: 'POST', body: JSON.stringify({ subscription: sub }) });
          btn.textContent = '🔔 Notificações ativas';
          btn.classList.add('active');
          showToast('Notificações ativadas!');
          // Envia teste
          setTimeout(() => api('/push/teste', { method: 'POST' }), 500);
        } catch (err) { showToast('Erro ao ativar: ' + err.message); }
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(base64);
      const arr = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    }

    // --- Init ---
    if ('serviceWorker' in navigator && location.protocol.includes('http')) {
      navigator.serviceWorker.register('/static/sw.js').then(reg => {
        console.log('[SW] registrado com sucesso');
      }).catch(err => {
        console.error('[SW] erro ao registrar:', err);
      });
    }
    if (token) {
      api('/me').then(r => r.ok ? r.json() : null).then(j => {
        if (j && j.ok) { currentUser = j.usuario; showApp(); }
        else { doLogout(); }
      }).catch(() => doLogout());
    }
  </script>
</body>
</html>
